name: "publish"
on:
  workflow_dispatch:
  push:
    branches:
      - release
    paths-ignore:
      - "apps/typwriter-web/**"

# Release creation and updater metadata must each have a single writer.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create or find the shared release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { prepareRelease } = require('./.github/scripts/release.cjs');
            const desktop = require('./apps/typwriter-desktop/src-tauri/tauri.conf.json');
            const mobile = require('./apps/typwriter-mobile/src-tauri/tauri.conf.json');
            const release = await prepareRelease({
              github, context, version: desktop.version, mobileVersion: mobile.version,
            });
            core.setOutput('release_id', release.id);

  publish-tauri:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' &&
            'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/typwriter-desktop/src-tauri -> target"

      - name: install frontend dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/typwriter-desktop
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # Generate latest.json once after every platform has uploaded.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  publish-android:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    with:
      release-id: ${{ fromJSON(needs.prepare.outputs.release_id) }}
    secrets: inherit

  finalize:
    needs: [prepare, publish-tauri, publish-android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release assets and publish the complete updater manifest
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            const { publishUpdater } = require('./.github/scripts/release.cjs');
            const { version } = require('./apps/typwriter-desktop/src-tauri/tauri.conf.json');
            await publishUpdater({
              github, context, version, releaseId: Number(process.env.RELEASE_ID),
            });
