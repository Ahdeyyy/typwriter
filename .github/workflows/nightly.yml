name: "nightly"

# Builds "Typwriter Nightly": a separate app (own identifier, name, icon and
# updater endpoint, from each app's tauri.nightly.conf.json) that installs
# alongside stable. Everything lands on the rolling `nightly` prerelease, which
# GitHub never treats as latest, so stable's updater and downloads are untouched.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "apps/typwriter-web/**"

# The release is only written by the final job, but two runs must never write
# it at once. A newer push waits for the running build (and replaces any build
# still waiting) instead of cancelling a half-finished publish.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute nightly version
        id: version
        run: |
          VERSION=$(node .github/scripts/nightly.cjs version ${{ github.run_number }})
          echo "Nightly version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  nightly-desktop:
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            bundle_dir: target/aarch64-apple-darwin/release/bundle
            arch: aarch64
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            bundle_dir: target/x86_64-apple-darwin/release/bundle
            arch: x64
          - platform: "ubuntu-22.04"
            args: ""
            bundle_dir: target/release/bundle
            arch: amd64
          # MSI cannot carry a prerelease version, so nightly ships NSIS only.
          - platform: "windows-latest"
            args: "--bundles nsis"
            bundle_dir: target/release/bundle
            arch: x64
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' &&
            'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/typwriter-desktop/src-tauri -> target"
          key: nightly-desktop-${{ matrix.platform }}-${{ matrix.args }}

      - name: install frontend dependencies
        run: bun install

      - name: Write nightly config
        run: |
          node .github/scripts/nightly.cjs config apps/typwriter-desktop "$VERSION" ${{ github.run_number }} "$RUNNER_TEMP/nightly.conf.json"
          cat "$RUNNER_TEMP/nightly.conf.json"

      - name: Build
        working-directory: apps/typwriter-desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build ${{ matrix.args }} --config "$RUNNER_TEMP/nightly.conf.json"

      - name: Collect bundles
        run: |
          node .github/scripts/nightly.cjs collect \
            "apps/typwriter-desktop/src-tauri/${{ matrix.bundle_dir }}" nightly-assets "$VERSION" ${{ matrix.arch }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: nightly-desktop-${{ strategy.job-index }}
          path: nightly-assets/*
          if-no-files-found: error

  nightly-android:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    with:
      release-id: 0
      channel: nightly
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  publish:
    needs: [prepare, nightly-desktop, nightly-android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-desktop-*
          path: nightly-assets
          merge-multiple: true

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: android-apks-*
          path: nightly-assets
          merge-multiple: true

      - name: List assets
        run: ls -la nightly-assets/

      - name: Publish the nightly release and its updater manifest
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            const { publishNightly } = require('./.github/scripts/nightly.cjs');
            await publishNightly({
              github, context, version: process.env.VERSION, dir: 'nightly-assets',
              warn: message => core.warning(message),
            });
