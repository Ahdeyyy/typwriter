[package]
name = "tauri-plugin-spellcheck"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Android's own spellchecker service (SpellCheckerSession) for Typwriter mobile."
# Required by tauri-plugin: the build script hands the Android library path to
# the app through `DEP_TAURI_PLUGIN_SPELLCHECK_ANDROID_LIBRARY_PATH`.
links = "tauri-plugin-spellcheck"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
